dataSourceKey: sgDS
destination: sg
groupId: g_sg
outerAdapterKey: adb_sg
concurrent: false
dbMapping:
  database: assign_cw
  table: pop_up_notification
  targetDatabase: ODS
  targetTable: ods_sg_pop_up_notification
  # 主键
  targetPk:
    id: id
  # 关闭全字段自动映射，手动定义字段映射
  mapAllColumns: false
  # 字段映射
  targetColumns:
    id: id
    popup_name: popup_name
    status: status
    priority: priority
    remark: remark
    main_image: main_image
    thumbnail_image: thumbnail_image
    jump_link: jump_link
    popup_style: popup_style
    advertising_id: advertising_id
    show_close_button: show_close_button
    start_date: start_date
    end_date: end_date
    exposure_count: exposure_count
    click_count: click_count
    close_count: close_count
    create_time: create_time
    update_time: update_time
    create_by: create_by
    update_by: update_by
    deleted: deleted
    is_effective: is_effective
fullBatch:
  enable: true
  startupTime: 2000-01-01 00:00:00
  sleepBatchTime: 1000
  batchSize: 1000