  database: assign_cw
  table: app_group_device_rela
  targetDatabase: ODS
  targetTable: ods_sg_app_group_device_rela
  # 主键
  targetPk:
    id: id
  # 关闭全字段自动映射，手动定义字段映射
  mapAllColumns: false
  # 字段映射
  targetColumns:
      id: id
      app_user_id: app_user_id
      group_id: group_id
      uid: uid
      channel_no: channel_no
      device_name: device_name
      bind_time: bind_time
      type: type
      purview: purview
      gmt_modify: gmt_modify
      remark_name: remark_name
      push_flag: push_flag
      flag_end_time: flag_end_time
      country_name: country_name
      country_code: country_code
fullBatch:
  enable: true
  startupTime: 2000-01-01 00:00:00
  sleepBatchTime: 1000
  batchSize: 1000